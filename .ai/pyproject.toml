[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemedicina-ai-harness"
version = "0.4.0"
description = "Harness de desarrollo agnóstico para telemedicina Flutter / ASP.NET Core"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
teleharness = "teleharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
